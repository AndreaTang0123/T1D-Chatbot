# 0. Disable management dashboard
manager_api:
  enabled: false
standalone_mode: true

# 1. System & Logging
delete_audio: false
temp_dir: "./temp"
log:
  log_level: "INFO"
  log_dir: "./data"
  log_file: "app.log"
  data_dir: "data"

# 3. Module Selection
selected_module:
  VAD: "silero"
  ASR: "fun_local"
  TTS: "edge"
  LLM: "openai"
  Intent: "function_call"

# 3. VAD Settings
VAD:
  silero:
    type: "silero"
    model_dir: "./models/snakers4_silero-vad"
    threshold: 0.5

# 4. ASR Settings
ASR:
  # Default (English)
  fun_local:
    type: "fun_local"
    device: "cpu"
    model_dir: "iic/speech_paraformer_asr-en-16k-vocab4199-pytorch"
    output_dir: "./temp/asr_output"

  # Explicit English Option
  fun_local_en:
    type: "fun_local"
    device: "cpu"
    model_dir: "iic/speech_paraformer_asr-en-16k-vocab4199-pytorch"
    output_dir: "./temp/asr_output"

  # Multilingual Option (SenseVoiceSmall - Likely the previous default)
  fun_local_multilingual:
    type: "fun_local"
    device: "cpu"
    model_dir: "iic/SenseVoiceSmall"
    output_dir: "./temp/asr_output"

# 5. LLM Settings
LLM:
  openai:
    type: "openai"
    base_url: "http://localhost:11434/v1"
    api_key: "ollama"
    model_name: "gemma4:31b-cloud"  # Ollama 云端模型：对话内容会发到 Ollama 服务器
    timeout: 30
    num_ctx: 32768 # Increased for 16GB RAM: enables processing longer news timelines and history
    temperature: 0.5 # Controls randomness (0.0 to 2.0). Default is 1.0. Lower is more deterministic.

# 6. TTS Settings
TTS:
  edge:
    type: "edge"
    voice: "en-US-JennyNeural"

# 7. Prompt Settings (MOVED TO TOP LEVEL)
prompt: "Provide short and concise responses, unless asked to elaborate."

# 8. Server Settings
server:
  port: 8000
  http_port: 8003
  host: "0.0.0.0"
  timezone_offset: -5
  websocket: "ws://100.93.0.100:8000/xiaozhi/v1/"

# 9. Audio Settings
audio:
  format: "opus"
  sample_rate: 16000
  channels: 1
  frame_duration: 60

# 10. XiaoZhi Device Handshake Settings
xiaozhi:
  version: 1
  auth_key: "8d3193a0-e8e1-4af9-ae9e-1c6f72623580"
  message: "Ready"
  llm_handshake: true

# 11. Intent Settings
# 主 LLM 自己决定要不要调用工具（时间/天气/地点由 core/utils/fast_intent.py 的规则直接回答）
Intent:
  function_call:
    type: "function_call"
    functions:
      - "get_diabetes_data"  # CGM / 泵分析：工具内部跑 decision -> interpretation，主模型按 persona 回答
      - "web_search"         # DuckDuckGo
      - "get_weather"        # 非本地天气（本地天气已在 system prompt 的 <context> 里）
      - "say_goodbye"

wakeup_words:
  - "Are you there?"
  - "Hello Janet"

exit_commands:
  - "exit"
  - "stop"
  - "goodbye"
  - "shutup"

exit_replies:
  - "Goodbye!"
  - "See you later!"
  - "Take care!"
  - "Bye for now!"
  - "Catch you later!"

# CGM 读数超过这么多分钟没更新，就告诉 LLM "暂无最新数据"，不能当作当前值
cgm_stale_after_minutes: 15
# 最近一次泵事件超过这么多小时，泵的规律、bolus 反应、异常都只当作历史数据
pump_stale_after_hours: 6

plugins:
  get_weather:
    default_location: "Chapel Hill"
    unit_system: "imperial" # Options: "metric" (default), "imperial"

  web_search:
    count: 3
