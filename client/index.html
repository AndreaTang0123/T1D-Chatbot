<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>T1D Chat</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --panel: #ffffff;
      --text: #1c1d21;
      --muted: #6b6f76;
      --user: #2f6fed;
      --user-text: #ffffff;
      --bot: #ffffff;
      --border: #dcdfe4;
      --ok: #1f9d55;
      --warn: #d69e2e;
      --err: #d64545;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111214;
        --panel: #1b1c1f;
        --text: #e8e9eb;
        --muted: #9a9ea6;
        --user: #3b7cf5;
        --bot: #25272b;
        --border: #33363b;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 16px/1.45 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 17px; margin: 0; flex: 1; }
    #statusDot {
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--err);
      flex: none;
    }
    #statusDot.connecting { background: var(--warn); }
    #statusDot.ready { background: var(--ok); }
    #statusText { font-size: 13px; color: var(--muted); }
    #voiceLabel {
      font-size: 12px;
      color: var(--muted);
      padding: 2px 8px;
      border: 1px solid var(--border);
      border-radius: 10px;
      white-space: nowrap;
    }
    #voiceLabel:empty { display: none; }
    #reconnectBtn {
      font: inherit; font-size: 14px;
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--text);
    }
    #reconnectBtn[hidden] { display: none; }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      -webkit-overflow-scrolling: touch;
    }
    .bubble {
      max-width: 82%;
      padding: 9px 13px;
      border-radius: 16px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bubble.user {
      align-self: flex-end;
      background: var(--user);
      color: var(--user-text);
      border-bottom-right-radius: 4px;
    }
    .bubble.bot {
      align-self: flex-start;
      background: var(--bot);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .notice {
      align-self: center;
      font-size: 12px;
      color: var(--muted);
    }
    #talkBar {
      display: flex;
      justify-content: center;
      padding: 12px 16px 4px;
      background: var(--panel);
      border-top: 1px solid var(--border);
    }
    /* 按住说话：禁止长按选中/菜单/双击缩放，按下时变红，外圈随音量扩散 */
    #talkBtn {
      --level: 0;
      width: 100%;
      max-width: 420px;
      height: 72px;
      border: 0;
      border-radius: 36px;
      background: var(--user);
      color: #fff;
      font: inherit;
      font-size: 18px;
      font-weight: 600;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
      box-shadow: 0 0 0 calc(var(--level) * 16px) rgba(47, 111, 237, 0.25);
      transition: box-shadow 60ms linear, transform 80ms ease, background 80ms ease;
    }
    #talkBtn.recording {
      background: var(--err);
      transform: scale(0.98);
      box-shadow: 0 0 0 calc(var(--level) * 16px) rgba(214, 69, 69, 0.3);
    }
    #talkBtn:disabled { opacity: 0.4; }
    form {
      display: flex;
      gap: 8px;
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
      background: var(--panel);
    }
    /* 16px 以上，避免 iOS 聚焦时自动放大 */
    #textInput {
      flex: 1;
      min-width: 0;
      font: inherit;
      font-size: 16px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--bg);
      color: var(--text);
    }
    #sendBtn {
      font: inherit;
      padding: 0 18px;
      border: 0;
      border-radius: 20px;
      background: var(--user);
      color: #fff;
    }
    #sendBtn:disabled { opacity: 0.4; }
  </style>
</head>
<body>
  <header>
    <span id="statusDot"></span>
    <h1>T1D Chat</h1>
    <span id="voiceLabel"></span>
    <span id="statusText">Disconnected</span>
    <button id="reconnectBtn" type="button" hidden>Reconnect</button>
  </header>

  <main id="messages">
    <div class="notice">Replies are generated by a cloud LLM (Ollama gemma4:31b-cloud)</div>
  </main>

  <div id="talkBar">
    <button id="talkBtn" type="button" disabled>Hold to talk</button>
  </div>

  <form id="inputForm" autocomplete="off">
    <input id="textInput" type="text" placeholder="Type a message…" enterkeyhint="send">
    <button id="sendBtn" type="submit" disabled>Send</button>
  </form>

  <!-- 与 server 仓库 test/js/utils/libopus.js 相同（asm.js 构建，同步初始化，导出 Module.instance） -->
  <script src="libopus.js"></script>
  <script src="tts-player.js"></script>
  <script src="app.js"></script>
</body>
</html>
